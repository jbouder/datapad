name: Deploy

on:
  # After CI finishes on `main` (production) or `v2` (staging, #327). The
  # `gate` job below only lets a successful run of a commit pushed to one of
  # those branches in this repository through.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, v2]
  # Re-deploy the current `main` or `v2` (new Cloudflare token, a
  # `wrangler.jsonc` var change) without re-running CI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Jobs cannot be skipped on a secret directly, so this one reads the secret
  # once and hands the answer to `deploy`. Without CLOUDFLARE_API_TOKEN
  # (forks, fresh clones) `deploy` is skipped and the run stays green. It
  # also picks the target from the branch: `main` is production, `v2` is
  # staging (`env.staging` in wrangler.jsonc, the `datapad-v2` Worker).
  gate:
    runs-on: ubuntu-latest
    # `branches: [main, v2]` above matches a fork PR whose branch has the
    # same name, so check the event and the head repository as well.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2')) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'v2'))
    outputs:
      enabled: ${{ steps.secret.outputs.enabled }}
      environment: ${{ steps.target.outputs.environment }}
      cloudflare_env: ${{ steps.target.outputs.cloudflare_env }}
    steps:
      - id: secret
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret; skipping deploy. See docs/self-hosting.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      # `main` ships the top-level config to production; `v2` ships
      # `env.staging` to staging. Any other branch is an error, never a
      # guess.
      - id: target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case "$BRANCH" in
            main)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "cloudflare_env=" >> "$GITHUB_OUTPUT"
              ;;
            v2)
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              echo "cloudflare_env=staging" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::No deploy target for branch $BRANCH"
              exit 1
              ;;
          esac

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.gate.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.gate.outputs.environment }}
      cancel-in-progress: false
    env:
      # Read by the Cloudflare Vite plugin at build time: empty builds the
      # top-level (production) config, `staging` builds `env.staging`.
      # `wrangler deploy` then ships the config the build wrote.
      CLOUDFLARE_ENV: ${{ needs.gate.outputs.cloudflare_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed, not whatever the branch points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version in package.json's `packageManager`, everywhere.
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Refuse to ship without Access: an empty ACCESS_AUD or
      # ACCESS_TEAM_DOMAIN, or DEV_ACCESS_EMAIL among the vars. It checks
      # production's vars and every environment's (#232, #327).
      - name: Check Access is configured
        run: bun scripts/check-deploy.ts
      - run: bun run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
