name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. `pull_request` (never `pull_request_target`)
# keeps fork PRs on a read-only token with no access to repository secrets.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on `main` queue
# instead of cancelling, so every commit on `main` gets a result (and
# .github/workflows/deploy.yml, which follows a successful run, a trigger).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Stable name: make "check" a required status check on `main`
    # (see docs/self-hosting.md).
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version in package.json's `packageManager`, everywhere.
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Every installed package's license against the allowlist in
      # scripts/licenses.ts (exceptions are named there, with reasons).
      - run: bun run licenses
      # Known advisories in the installed packages, moderate and up. One
      # with no fixed release yet is skipped by id with `--ignore=GHSA-…`
      # and a comment saying why (see docs/self-hosting.md).
      - run: bun audit --audit-level=moderate
      # No .dev.vars here: the generated Env must not depend on one.
      - run: bunx wrangler types
      - run: bunx biome ci .
      # Unused files, exports and dependencies (knip.jsonc).
      - run: bunx knip
      - run: bunx tsc -b
      - run: bunx vite build
      # The entry's JS and CSS (gzip) against scripts/budget.ts, and
      # WebLLM kept out of it.
      - run: bun run budget
      # With the coverage floors on shared/ and worker/ (vitest.config.ts).
      - run: bunx vitest run --coverage

  # The browser suite (e2e/, Playwright + axe) against the built app under
  # `vite preview`, desktop and phone projects, split across four runners.
  # `fullyParallel` is on, so `--shard` splits tests, not files, and the
  # heavy specs (a11y, spaces, motion) spread evenly. After `check`, so a
  # lint or type error fails fast.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    needs: check
    runs-on: ubuntu-latest
    # Chromium and its system libraries come with the image: no browser
    # download or apt step. Pinned by digest, as the actions are by SHA: a
    # tag can be pushed again. The tag in the comment must match
    # @playwright/test in package.json (pinned exactly there); move the two
    # together, and resolve the new digest with `docker buildx imagetools
    # inspect mcr.microsoft.com/playwright:<tag>` (test/workflows.test.ts).
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-bun needs `unzip`, which the image lacks; npm's bun package
      # ships the binary without it. The version is package.json's
      # `packageManager`, as setup-bun reads it for `check`.
      - run: npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-container-${{ hashFiles('bun.lock') }}
          restore-keys: bun-container-
      - run: bun install --frozen-lockfile
      # Sign-in for the browser suite: the dev Access bypass, which the Worker
      # honors only while wrangler.jsonc's ACCESS_AUD is empty. The suite
      # never sees real credentials. Each test signs in as its own address.
      - name: Dev Access bypass for e2e
        run: |
          if grep -Eq '"ACCESS_AUD": *"[^"]+"' wrangler.jsonc; then
            echo "::warning::ACCESS_AUD is set in wrangler.jsonc; e2e overrides it for the preview build only."
          fi
          printf 'DEV_ACCESS_EMAIL=ci@datapad.test\nACCESS_AUD=\n' > .dev.vars
      - run: bunx playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # One stable status check for the whole suite: make "e2e" a required
  # check on `main` (see docs/self-hosting.md). Runs even when a shard
  # fails or `check` stops the shards, and fails unless every shard passed.
  e2e-done:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.e2e-shard.result != 'success'
        run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          exit 1
      - run: echo "All e2e shards passed."
