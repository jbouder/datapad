<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      // Mirrors apply() in src/providers/ThemeProvider.tsx; the ids come
      // from src/lib/themes.ts.
      (() => {
        const darkBased = ['dark', 'dagobah', 'kamino'];
        const palettes = ['dagobah', 'tatooine', 'kamino'];
        let saved = null;
        try {
          saved = localStorage.getItem('datapad:theme');
        } catch {
          // Blocked storage: follow the OS.
        }
        const root = document.documentElement;
        const known = darkBased.includes(saved) || ['light', 'tatooine'].includes(saved);
        const dark = known
          ? darkBased.includes(saved)
          : matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', dark);
        if (palettes.includes(saved)) root.dataset.theme = saved;
      })();
    </script>
    <meta name="description" content="A private project tracker: projects, tasks, notes, events and people." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <title>Datapad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
