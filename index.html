<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      // Mirrors apply() in src/providers/ThemeProvider.tsx; the ids come
      // from src/lib/themes.ts.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('datapad:theme');
        } catch {
          // Blocked storage: follow the OS.
        }
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <meta name="description" content="A private project tracker: projects, tasks, notes, events and people." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Behind Cloudflare Access the manifest needs the session cookie. -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Datapad" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Datapad" />
    <meta property="og:description" content="A private project tracker: projects, tasks, notes, events and people." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <title>Datapad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
